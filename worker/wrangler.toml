name = "scholarpay-download"
main = "index.js"
compatibility_date = "2025-06-01"

# ──────────────────────────────────────────────
# KV Namespace Binding
# Create this namespace in the Cloudflare Dashboard:
#   Workers & Pages → KV → Create namespace → "APP_DOWNLOADS"
# Then copy the ID below.
# ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "APP_DOWNLOADS"
id = "96e563ca353048718b43a829196bcd6a"

# ──────────────────────────────────────────────
# Routes
# Uncomment and configure if you want a custom domain
# ──────────────────────────────────────────────
# routes = [
#   { pattern = "download.scholarpay.app", custom_domain = true }
# ]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
